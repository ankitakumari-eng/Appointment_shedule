<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create schedule</title>
    
    <style>
        :root {
  /* Brand & Healthcare Color Palette - Clean Utility / Minimal */
  --primary-color: #2563eb;        /* Blue 600 */
  --primary-dark: #1d4ed8;         /* Blue 700 */
  --primary-light: #eff6ff;        /* Blue 50 Tint */
  --primary-hover: #1e40af;
  
  --secondary-color: #475569;      /* Slate 600 Secondary */
  --secondary-light: #f8fafc;
  
  /* Status Colors */
  --success-color: #166534;        /* Completed (Green) */
  --success-light: #dcfce7;
  --warning-color: #92400e;        /* Pending (Amber) */
  --warning-light: #fef3c7;
  --danger-color: #991b1b;         /* Cancelled (Red) */
  --danger-light: #fee2e2;
  --info-color: #1e40af;           /* Upcoming (Blue) */
  --info-light: #dbeafe;

  /* Surfaces & Backgrounds */
  --background-color: #f8fafc;     /* Clean Slate 50 canvas */
  --surface-color: #ffffff;        /* Pure white containers */
  --surface-hover: #f8fafc;
  
  /* Typography & Borders */
  --text-color: #1e293b;           /* Slate 800 Main Text */
  --text-heading: #0f172a;         /* Slate 900 Headings */
  --muted-color: #64748b;          /* Slate 500 Subtitle / Secondary Text */
  --border-color: #e2e8f0;         /* Slate 200 Border */
  --border-focus: #93c5fd;
  
  /* Geometry & Elevation */
  --font-family: 'SF Pro Text', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --radius-full: 9999px;
  
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.03), 0 1px 3px 0 rgba(0, 0, 0, 0.02);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.03);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.07), 0 4px 6px -4px rgba(0, 0, 0, 0.03);
  
  --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  
  /* Sidebar Dimensions */
  --sidebar-width: 256px;
  --header-height: 64px;
}
body {
    font-family: Arial, Helvetica, sans-serif;
    background-color: #fff;
    margin: 0;
    min-height: 100vh;
}

.top-text {
    width: 32px;
    height: 32px;

    background-color: #2563eb;
    color: white;

    border-radius: 8px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 1.1rem;
    font-weight: 700;

    flex-shrink: 0;
}
.brand-text {
    font-size: 1.25rem;
    font-weight: 700;

    color: #2563eb;

    letter-spacing: -0.025em;

    white-space: nowrap;
}

        .brand-text .Ankita {
            color: #1e3a8a;
        }
.app-container {
    width: 100%;
    min-height: 100vh;
}

.main-wrapper {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0; /* Prevents overflow issues */
  margin-left: var(--sidebar-width);
  transition: margin-left var(--transition-normal);
}

.page-content {
  padding: 24px;
  flex: 1;
  max-width: 1400px;
  width: 100%;
  margin: 0 auto;
}


.container {
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 16px;
}
.app-header {
    width: 100%;
    min-height: var(--header-height);

    background-color: var(--surface-color);
    border-bottom: 1px solid var(--border-color);

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 10px 24px;
    box-sizing: border-box;

    position: sticky;
    top: 0;
    z-index: 40;

    box-shadow: var(--shadow-sm);
}
.sidebar-toggle-btn {
  background: transparent;
  border: 1px solid var(--border-color);
  color: var(--text-color);
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: none; /* Visible on smaller screens */
  align-items: center;
  gap: 6px;
  font-size: 0.875rem;
}

.sidebar-toggle-btn:hover {
  background-color: var(--surface-hover);
}

.header-title {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--text-color);
}
.header-left {
    display: flex;
    align-items: center;
    gap: 16px;
    min-width: 0;
    flex: 1;
}

.header-right {
    display: flex;
    align-items: center;

    gap: 16px;

    flex-shrink: 0;
}

.user-profile {
    display: flex;
    align-items: center;

    gap: 12px;

    flex-shrink: 0;
}

.user-avatar {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-full);
  background-color: var(--primary-light);
  color: var(--primary-dark);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 0.95rem;
  border: 2px solid var(--primary-color);
}

.user-info {
  display: flex;
  flex-direction: column;
}

.user-name {
  font-weight: 600;
  font-size: 0.9rem;
  line-height: 1.2;
}

.user-role {
  font-size: 0.75rem;
  color: var(--muted-color);
}
.create-schedule-section {
    width: 100%;
    max-width: 1200px;
    margin: 40px auto 0;
    padding: 0 24px;
    box-sizing: border-box;
}
@media (max-width: 600px) {

    .app-header {
        min-height: 64px;
        padding: 10px 12px;
    }

    .header-left {
        gap: 8px;
        min-width: 0;
    }

    .brand-text {
        font-size: 1rem;
    }

    .header-right {
        gap: 8px;
    }

    .user-profile {
        gap: 6px;
    }

    .user-avatar {
        width: 34px;
        height: 34px;
        font-size: 0.8rem;
    }

    .user-info {
        min-width: 0;
    }

    .user-name {
        font-size: 0.8rem;
        white-space: nowrap;
    }


}
/* =========================
   CREATE SCHEDULE
========================= */

.schedule-section {
    width: 100%;
    max-width: 1000px;
    margin: 30px auto;
    padding: 0 24px;
    box-sizing: border-box;
}

.schedule-card {
    background-color: var(--surface-color);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 28px;
    box-shadow: var(--shadow-md);
}

.schedule-title {
    margin: 0 0 6px;
    font-size: 1.5rem;
    color: var(--text-heading);
}

.schedule-subtitle {
    margin: 0 0 24px;
    color: var(--muted-color);
    font-size: 0.9rem;
}

/* Form layout */

.schedule-form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.form-group.full-width {
    grid-column: 1 / -1;
}

.form-group label {
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--text-color);
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    box-sizing: border-box;

    padding: 11px 12px;

    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);

    background-color: #ffffff;
    color: var(--text-color);

    font-family: inherit;
    font-size: 0.9rem;

    outline: none;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px var(--primary-light);
}

.form-group textarea {
    min-height: 100px;
    resize: vertical;
}

/* Buttons */

.schedule-actions {
    grid-column: 1 / -1;

    display: flex;
    justify-content: flex-end;
    gap: 12px;

    margin-top: 8px;
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    gap: 8px;

    padding: 10px 18px;

    border-radius: var(--radius-md);

    font-size: 0.875rem;
    font-weight: 600;

    cursor: pointer;

    border: 1px solid transparent;
}

.btn-primary {
    background-color: var(--primary-color);
    color: white;
}

.btn-primary:hover {
    background-color: var(--primary-dark);
}

.btn-secondary {
    background-color: white;
    color: var(--text-color);
    border-color: var(--border-color);
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .schedule-section {
        margin: 20px auto;
        padding: 0 12px;
    }

    .schedule-card {
        padding: 20px;
    }

    .schedule-title {
        font-size: 1.25rem;
    }

    .schedule-form {
        grid-template-columns: 1fr;
        gap: 16px;
    }

    .form-group.full-width {
        grid-column: auto;
    }

    .schedule-actions {
        grid-column: auto;

        flex-direction: column;
    }

    .schedule-actions .btn {
        width: 100%;
    }
}

    </style>
    <script src="../assets/js/createShedule.js"></script>
    </head>
<body>

    <div class="app-container">

        <!-- HEADER -->
        <header class="app-header">

            <div class="header-left">

                <div class="top-text">
                    ✚
                </div>

                <div class="brand-text">
                    <span class="Ankita">Care</span><span>Direct</span>
                </div>

            </div>

            <div class="header-right">

                <div class="user-profile">

                    <div class="user-avatar">
                        Pt
                    </div>

                    <div class="user-info">

                        <span class="user-name">
                            Kumari Anisha
                        </span>

                        
                    </div>

                </div>

            </div>

        </header>


        <!-- CREATE SCHEDULE -->
        <section class="schedule-section">

            <h1>Create Schedule</h1>

            <div class="schedule-card">

                <h2 class="schedule-title">
                    Create Schedule
                </h2>

                <p class="schedule-subtitle">
                    Create a new appointment for a patient.
                </p>

                <form class="schedule-form" id="scheduleForm">

                    <!-- Patient -->
                    <div class="form-group">

                        <label for="patientName">
                            Patient Name
                        </label>

                        <input
                            type="text"
                            id="patientName"
                            name="patientName"
                            placeholder="Enter patient name"
                            required
                        >

                    </div>


                    <!-- Doctor -->
                    <div class="form-group">

                        <label for="doctorName">
                            Doctor Name
                        </label>

                        <select
                            id="doctorName"
                            name="doctorName"
                            required
                        >
                            <option value="">
                                Select Department First
                            </option>
                        </select>

                    </div>


                    <!-- Date -->
                    <div class="form-group">

                        <label for="appointmentDate">
                            Appointment Date
                        </label>

                        <input
                            type="date"
                            id="appointmentDate"
                            name="appointmentDate"
                            required
                        >

                    </div>


                    <!-- Time -->
                    <div class="form-group">

                        <label for="appointmentTime">
                            Time Slot
                        </label>

                        <select
                            id="appointmentTime"
                            name="appointmentTime"
                            required
                        >

                            <option value="">
                                Select Time Slot
                            </option>

                            <option value="09:00 AM">09:00 AM</option>
                            <option value="09:30 AM">09:30 AM</option>
                            <option value="10:00 AM">10:00 AM</option>
                            <option value="10:30 AM">10:30 AM</option>
                            <option value="11:00 AM">11:00 AM</option>
                            <option value="11:30 AM">11:30 AM</option>
                            <option value="12:00 PM">12:00 PM</option>
                            <option value="02:00 PM">02:00 PM</option>
                            <option value="02:30 PM">02:30 PM</option>
                            <option value="03:00 PM">03:00 PM</option>
                            <option value="03:00 PM">03:30 PM</option>
                            <option value="03:00 PM">04:00 PM</option>
                            <option value="03:00 PM">04:30 PM</option>
                            <option value="03:00 PM">05:00 PM</option>

                        </select>

                    </div>


                    <!-- Department -->
                    <div class="form-group">

                        <label for="department">
                            Department
                        </label>

                        <select
                            id="department"
                            name="department"
                            required
                        >

                            <option value="">
                                Select Department
                            </option>

                            <option value="Cardiology">
                                Cardiology
                            </option>

                            <option value="Neurology">
                                Neurology
                            </option>

                            <option value="Orthopedics">
                                Orthopedics
                            </option>

                            <option value="General Medicine">
                                General Medicine
                            </option>

                            <option value="Dermatology">
                                Dermatology
                            </option>

                            <option value="Pediatrics">
                                Pediatrics
                            </option>

                        </select>

                    </div>


                    <!-- Reason -->
                    <div class="form-group full-width">

                        <label for="reason">
                            Reason for Appointment
                        </label>

                        <textarea
                            id="reason"
                            name="reason"
                            placeholder="Enter reason for appointment..."
                            required
                        ></textarea>

                    </div>


                    <!-- Buttons -->
                    <div class="schedule-actions">

                        <button
                            type="reset"
                            class="btn btn-secondary"
                        >
                            Clear
                        </button>

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            📅 Create Schedule
                        </button>

                    </div>

                </form>

            </div>

        </section>

    </div>


    <!-- CREATE SCHEDULE JS -->
    <script src="../assets/js/createShedule.js"></script>

</body>
</html>
